<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collaborative Editor</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:#f0ede8;}
#app{display:flex;height:100vh;}

/* Article pane */
#article-pane{flex:1;overflow:hidden;position:relative;}
#article-frame{width:100%;height:100%;border:none;display:block;}

/* Drop zone */
#drop-zone{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#f7f5f0;z-index:10;}
#drop-zone.hidden{display:none;}
#drop-zone.drag-over{background:#efede8;}
.drop-icon{font-size:40px;opacity:.3;}
.drop-title{font-size:16px;font-weight:500;color:#1a1917;}
.drop-sub{font-size:13px;color:#8a8784;text-align:center;max-width:300px;line-height:1.6;}
.drop-btn{background:#1a1917;color:#f7f5f0;border:none;border-radius:6px;padding:10px 20px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.drop-btn:hover{background:#4a4845;}
#file-input{display:none;}
.drop-or{font-size:11px;color:#b8b5b0;font-family:'DM Mono',monospace;}

/* Loading overlay */
#loading{position:absolute;inset:0;background:rgba(247,245,240,0.85);z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;}
#loading.visible{display:flex;}
#loading span{font-size:13px;color:#8a8784;font-family:'DM Mono',monospace;}

/* Sidebar */
#sidebar{width:340px;flex-shrink:0;display:flex;flex-direction:column;background:#f7f5f0;border-left:1px solid #d8d4cc;}
#sidebar-header{padding:14px 16px 12px;border-bottom:1px solid #d8d4cc;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
#sidebar-title{font-size:13px;font-weight:500;color:#1a1917;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;}
#header-btns{display:flex;gap:6px;align-items:center;}
.hbtn{font-size:11px;padding:4px 9px;border-radius:4px;border:0.5px solid #d8d4cc;background:#efede8;color:#4a4845;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;}
.hbtn:hover{background:#e0ddd8;}
.hbtn.active{background:#1a1917;color:#f7f5f0;border-color:#1a1917;}

/* Tab bar */
#tab-bar{display:flex;border-bottom:1px solid #d8d4cc;flex-shrink:0;}
.tab{flex:1;padding:10px;text-align:center;font-size:12px;color:#8a8784;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;}
.tab:hover{color:#1a1917;}
.tab.active{color:#1a1917;border-bottom-color:#1a1917;font-weight:500;}
#comment-badge{background:#c0392b;color:#fff;border-radius:10px;font-size:10px;padding:1px 5px;margin-left:4px;display:none;}

/* Name bar */
#name-bar{padding:8px 14px;background:#efede8;border-bottom:1px solid #d8d4cc;display:flex;align-items:center;gap:8px;flex-shrink:0;}
#name-bar label{font-size:11px;color:#8a8784;font-family:'DM Mono',monospace;white-space:nowrap;}
#name-input{flex:1;border:0.5px solid #d8d4cc;border-radius:4px;padding:4px 8px;font-size:12px;font-family:'DM Sans',sans-serif;background:#fff;color:#1a1917;}
#name-input:focus{outline:none;border-color:#8a8784;}

/* Selection bar */
#selection-bar{padding:8px 14px;background:#efede8;border-bottom:1px solid #d8d4cc;font-size:11px;color:#8a8784;font-family:'DM Mono',monospace;min-height:36px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
#selection-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#clear-sel{background:none;border:none;color:#b8b5b0;cursor:pointer;font-size:13px;padding:0;display:none;}

/* Panels */
#panel-chat,#panel-comments{flex:1;overflow:hidden;display:flex;flex-direction:column;}
#panel-comments{display:none;}

/* Chat */
#chat-area{flex:1;overflow-y:auto;padding:12px 14px 0;display:flex;flex-direction:column;gap:8px;}
.msg{font-size:13px;line-height:1.6;word-wrap:break-word;}
.msg-user{align-self:flex-end;background:#1a1917;color:#f7f5f0;padding:7px 11px;border-radius:10px 10px 2px 10px;max-width:82%;}
.msg-claude{align-self:flex-start;color:#1a1917;padding:7px 11px;background:#efede8;border-radius:10px 10px 10px 2px;max-width:90%;white-space:pre-wrap;}
.msg-system{align-self:center;color:#b8b5b0;font-size:11px;font-family:'DM Mono',monospace;text-align:center;padding:3px 0;}
.msg-action{align-self:flex-start;color:#155724;padding:5px 9px;background:#d4edda;border-radius:6px;max-width:90%;font-size:12px;font-family:'DM Mono',monospace;}
.msg-err{align-self:flex-start;color:#7a1e1e;padding:5px 9px;background:#fde8e8;border-radius:6px;max-width:90%;font-size:12px;}
.thinking{display:flex;gap:4px;align-items:center;padding:8px 14px;}
.dot{width:5px;height:5px;border-radius:50%;background:#b8b5b0;animation:pulse 1.2s ease-in-out infinite;}
.dot:nth-child(2){animation-delay:.2s;} .dot:nth-child(3){animation-delay:.4s;}
@keyframes pulse{0%,80%,100%{transform:scale(0.8);opacity:.5;}40%{transform:scale(1);opacity:1;}}

#chat-input-area{padding:10px 14px 12px;border-top:1px solid #d8d4cc;flex-shrink:0;}
#chat-input-area.disabled{opacity:.4;pointer-events:none;}
#input-row{display:flex;gap:7px;align-items:flex-end;}
#user-input{flex:1;border:0.5px solid #d8d4cc;border-radius:8px;padding:7px 10px;font-size:13px;font-family:'DM Sans',sans-serif;color:#1a1917;background:#fff;resize:none;line-height:1.5;min-height:36px;max-height:100px;overflow-y:auto;}
#user-input:focus{outline:none;border-color:#8a8784;}
#send-btn{background:#1a1917;color:#f7f5f0;border:none;border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;flex-shrink:0;height:36px;}
#send-btn:disabled{opacity:.4;cursor:not-allowed;}
#hint{font-size:10px;color:#b8b5b0;font-family:'DM Mono',monospace;margin-top:5px;}

/* Comments panel */
#comments-list{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
#comment-input-area{padding:10px 14px 12px;border-top:1px solid #d8d4cc;flex-shrink:0;}
#comment-input-area.disabled{opacity:.4;pointer-events:none;}
#comment-text{width:100%;border:0.5px solid #d8d4cc;border-radius:8px;padding:7px 10px;font-size:13px;font-family:'DM Sans',sans-serif;color:#1a1917;background:#fff;resize:none;min-height:60px;max-height:100px;}
#comment-text:focus{outline:none;border-color:#8a8784;}
#add-comment-btn{margin-top:7px;width:100%;background:#1a1917;color:#f7f5f0;border:none;border-radius:6px;padding:8px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;}
#add-comment-btn:disabled{opacity:.4;cursor:not-allowed;}
#no-comments{text-align:center;color:#b8b5b0;font-size:12px;font-family:'DM Mono',monospace;padding:30px 0;}

.comment-card{background:#fff;border:0.5px solid #d8d4cc;border-radius:8px;padding:10px 12px;position:relative;}
.comment-card.resolved{opacity:.5;}
.comment-author{font-size:12px;font-weight:500;color:#1a1917;}
.comment-time{font-size:10px;color:#b8b5b0;font-family:'DM Mono',monospace;margin-left:6px;}
.comment-quote{font-size:11px;color:#8a8784;font-style:italic;margin:4px 0;padding-left:8px;border-left:2px solid #d8d4cc;font-family:'DM Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.comment-body{font-size:13px;color:#1a1917;line-height:1.5;margin-top:4px;}
.comment-actions{display:flex;gap:8px;margin-top:8px;}
.comment-btn{background:none;border:none;font-size:11px;color:#8a8784;cursor:pointer;font-family:'DM Mono',monospace;padding:0;}
.comment-btn:hover{color:#1a1917;}

/* Sync indicator */
#sync-dot{width:7px;height:7px;border-radius:50%;background:#27ae60;flex-shrink:0;transition:background .3s;}
#sync-dot.syncing{background:#f39c12;}
#sync-dot.error{background:#e74c3c;}
</style>
</head>
<body>
<div id="app">
  <div id="article-pane">
    <div id="drop-zone">
      <div class="drop-icon">&#x1F4C4;</div>
      <div class="drop-title">Drop your HTML file here</div>
      <div class="drop-sub">Once uploaded it syncs to all collaborators automatically</div>
      <div class="drop-or">or</div>
      <button class="drop-btn" onclick="document.getElementById('file-input').click()">Choose file</button>
      <input type="file" id="file-input" accept=".html,.htm" onchange="handleFileInput(event)">
    </div>
    <div id="loading"><div class="thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><span id="loading-msg">Loading...</span></div>
    <iframe id="article-frame" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>

  <div id="sidebar">
    <div id="sidebar-header">
      <span id="sidebar-title">Collaborative Editor</span>
      <div id="header-btns">
        <div id="sync-dot" title="Sync status"></div>
        <button class="hbtn" onclick="loadFromRemote()" title="Pull latest version">&#x21BB;</button>
        <button class="hbtn" onclick="saveEdits()">Export</button>
      </div>
    </div>

    <div id="tab-bar">
      <div class="tab active" id="tab-chat" onclick="switchTab('chat')">Claude AI</div>
      <div class="tab" id="tab-comments" onclick="switchTab('comments')">Comments <span id="comment-badge"></span></div>
    </div>

    <div id="name-bar">
      <label>Your name:</label>
      <input type="text" id="name-input" placeholder="Anonymous" maxlength="30">
    </div>

    <div id="selection-bar">
      <span id="selection-text">Select text to target edits or comments</span>
      <button id="clear-sel" onclick="clearSelection()">&#x2715;</button>
    </div>

    <!-- Chat panel -->
    <div id="panel-chat">
      <div id="chat-area">
        <div class="msg msg-system">Load an HTML file to get started.</div>
      </div>
      <div id="chat-input-area" class="disabled">
        <div id="input-row">
          <textarea id="user-input" placeholder="Describe your edit..." rows="1"
            onkeydown="handleChatKey(event)" oninput="autoResize(this)"></textarea>
          <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
        <div id="hint">Highlight text first to target a specific passage</div>
      </div>
    </div>

    <!-- Comments panel -->
    <div id="panel-comments">
      <div id="comments-list"><div id="no-comments">No comments yet</div></div>
      <div id="comment-input-area" class="disabled">
        <textarea id="comment-text" placeholder="Add a comment... (highlight text first to anchor it)"></textarea>
        <button id="add-comment-btn" onclick="addComment()">Add comment</button>
      </div>
    </div>
  </div>
</div>

<script>
var SUPABASE_URL = "https://fehvaiqxywedxwoyjbix.supabase.co";
var ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZlaHZhaXF4eXdlZHh3b3lqYml4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MjAxMDYsImV4cCI6MjA5NTI5NjEwNn0.UqmcpsTHXllx-60PYutASfM0AcvR7iQ2asoED1pKLSE";
var DOC_ID = "neocloud-market-map";
var POLL_INTERVAL = 5000;

var articleDoc = null;
var conversationHistory = [];
var currentFileName = '';
var articleTitle = '';
var savedRange = null;
var savedText = '';
var savedHTML = '';
var localVersion = null; // timestamp of last known remote state
var pollTimer = null;
var currentTab = 'chat';
var comments = [];

// ── Supabase helpers ──────────────────────────────────────────

function sbHeaders() {
  return {
    "apikey": ANON_KEY,
    "Authorization": "Bearer " + ANON_KEY,
    "Content-Type": "application/json",
    "Prefer": "return=representation"
  };
}

function sbFetch(path, method, body) {
  return fetch(SUPABASE_URL + path, {
    method: method || "GET",
    headers: sbHeaders(),
    body: body ? JSON.stringify(body) : undefined
  }).then(function(r) { return r.json(); });
}

// ── Sync indicator ────────────────────────────────────────────

function setSyncDot(state) {
  var d = document.getElementById('sync-dot');
  d.className = state === 'ok' ? '' : state;
}

// ── Document state ────────────────────────────────────────────

function pushDocument(html) {
  setSyncDot('syncing');
  var ts = new Date().toISOString();
  // Upsert
  return fetch(SUPABASE_URL + "/rest/v1/document_state?id=eq." + DOC_ID, {
    method: "PATCH",
    headers: sbHeaders(),
    body: JSON.stringify({ html: html, updated_at: ts })
  }).then(function(r) {
    if (r.status === 404 || r.status === 200 || r.status === 204) {
      // Try insert if patch found nothing
      if (r.status === 204) {
        return fetch(SUPABASE_URL + "/rest/v1/document_state", {
          method: "POST",
          headers: sbHeaders(),
          body: JSON.stringify({ id: DOC_ID, html: html, updated_at: ts })
        });
      }
    }
    return r;
  }).then(function() {
    localVersion = ts;
    setSyncDot('ok');
  }).catch(function() { setSyncDot('error'); });
}

function loadFromRemote() {
  showLoading('Loading from server...');
  return sbFetch("/rest/v1/document_state?id=eq." + DOC_ID + "&select=*")
    .then(function(data) {
      hideLoading();
      if (data && data.length > 0) {
        var row = data[0];
        if (row.updated_at !== localVersion) {
          localVersion = row.updated_at;
          loadArticleHTML(row.html, false);
          appendSystem('Loaded latest version from server.');
        }
      } else {
        hideLoading();
        appendSystem('No saved version found on server.');
      }
    }).catch(function(e) {
      hideLoading();
      setSyncDot('error');
    });
}

function pollForUpdates() {
  if (!articleDoc) return;
  sbFetch("/rest/v1/document_state?id=eq." + DOC_ID + "&select=updated_at")
    .then(function(data) {
      if (data && data.length > 0) {
        var remoteTs = data[0].updated_at;
        if (localVersion && remoteTs !== localVersion) {
          // Someone else updated — reload
          loadFromRemote().then(function() {
            appendSystem('Document updated by a collaborator.');
          });
        }
      }
    }).catch(function() {});
  loadCommentsFromRemote();
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollForUpdates, POLL_INTERVAL);
}

// ── Comments ──────────────────────────────────────────────────

function loadCommentsFromRemote() {
  sbFetch("/rest/v1/comments?document_id=eq." + DOC_ID + "&order=created_at.asc&select=*")
    .then(function(data) {
      if (data && Array.isArray(data)) {
        comments = data;
        renderComments();
        updateCommentBadge();
      }
    }).catch(function() {});
}

function addComment() {
  var text = document.getElementById('comment-text').value.trim();
  if (!text) return;
  var author = document.getElementById('name-input').value.trim() || 'Anonymous';
  var payload = {
    document_id: DOC_ID,
    author: author,
    text: text,
    selected_text: savedText || null,
    resolved: false
  };
  document.getElementById('add-comment-btn').disabled = true;
  sbFetch("/rest/v1/comments", "POST", payload)
    .then(function(data) {
      document.getElementById('comment-text').value = '';
      document.getElementById('add-comment-btn').disabled = false;
      loadCommentsFromRemote();
      if (savedText) highlightComment(savedText);
      clearSelection();
    }).catch(function() {
      document.getElementById('add-comment-btn').disabled = false;
    });
}

function resolveComment(id) {
  fetch(SUPABASE_URL + "/rest/v1/comments?id=eq." + id, {
    method: "PATCH",
    headers: sbHeaders(),
    body: JSON.stringify({ resolved: true })
  }).then(function() { loadCommentsFromRemote(); });
}

function deleteComment(id) {
  fetch(SUPABASE_URL + "/rest/v1/comments?id=eq." + id, {
    method: "DELETE",
    headers: sbHeaders()
  }).then(function() { loadCommentsFromRemote(); });
}

function renderComments() {
  var list = document.getElementById('comments-list');
  var noC = document.getElementById('no-comments');
  if (!comments || comments.length === 0) {
    list.innerHTML = '';
    list.appendChild(noC);
    noC.style.display = 'block';
    return;
  }
  list.innerHTML = '';
  comments.forEach(function(c) {
    var card = document.createElement('div');
    card.className = 'comment-card' + (c.resolved ? ' resolved' : '');
    var time = new Date(c.created_at).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    var quoteHTML = c.selected_text ? '<div class="comment-quote">"' + esc(c.selected_text.slice(0,80)) + '"</div>' : '';
    card.innerHTML =
      '<div><span class="comment-author">' + esc(c.author) + '</span><span class="comment-time">' + time + '</span></div>' +
      quoteHTML +
      '<div class="comment-body">' + esc(c.text) + '</div>' +
      '<div class="comment-actions">' +
        (!c.resolved ? '<button class="comment-btn" onclick="resolveComment(\'' + c.id + '\')">&#x2713; Resolve</button>' : '<span class="comment-btn" style="color:#27ae60">Resolved</span>') +
        '<button class="comment-btn" onclick="deleteComment(\'' + c.id + '\')">Delete</button>' +
      '</div>';
    list.appendChild(card);
  });
}

function updateCommentBadge() {
  var open = comments.filter(function(c) { return !c.resolved; }).length;
  var badge = document.getElementById('comment-badge');
  if (open > 0) { badge.textContent = open; badge.style.display = 'inline'; }
  else { badge.style.display = 'none'; }
}

function highlightComment(text) {
  if (!articleDoc || !text) return;
  var walker = articleDoc.createTreeWalker(articleDoc.body, NodeFilter.SHOW_TEXT, null);
  var node;
  while ((node = walker.nextNode())) {
    var idx = node.textContent.indexOf(text);
    if (idx !== -1) {
      var range = articleDoc.createRange();
      range.setStart(node, idx);
      range.setEnd(node, idx + text.length);
      var span = articleDoc.createElement('span');
      span.className = 'comment-mark';
      span.title = 'Comment';
      range.surroundContents(span);
      break;
    }
  }
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── File loading ──────────────────────────────────────────────

var pane = document.getElementById('article-pane');
pane.addEventListener('dragover', function(e){ e.preventDefault(); document.getElementById('drop-zone').classList.add('drag-over'); });
pane.addEventListener('dragleave', function(e){ if(!e.relatedTarget||!pane.contains(e.relatedTarget)) document.getElementById('drop-zone').classList.remove('drag-over'); });
pane.addEventListener('drop', function(e){ e.preventDefault(); document.getElementById('drop-zone').classList.remove('drag-over'); var f=e.dataTransfer.files[0]; if(f) loadFile(f); });

function handleFileInput(e){ var f=e.target.files[0]; if(f) loadFile(f); }

function loadFile(file) {
  if (!file.name.match(/\.html?$/i)) { alert('Please drop an HTML file.'); return; }
  currentFileName = file.name.replace(/\.html?$/i, '');
  var r = new FileReader();
  r.onload = function(e) {
    loadArticleHTML(e.target.result, true);
  };
  r.readAsText(file);
}

function showLoading(msg) {
  document.getElementById('loading-msg').textContent = msg || 'Loading...';
  document.getElementById('loading').classList.add('visible');
}
function hideLoading() {
  document.getElementById('loading').classList.remove('visible');
}

function loadArticleHTML(html, isNew) {
  var frame = document.getElementById('article-frame');
  frame.srcdoc = html;
  frame.onload = function() {
    articleDoc = frame.contentDocument;
    var t = articleDoc.querySelector('title');
    articleTitle = t ? t.textContent : currentFileName;
    document.getElementById('sidebar-title').textContent = articleTitle || 'Collaborative Editor';
    articleDoc.body.contentEditable = 'true';
    articleDoc.body.style.outline = 'none';
    injectArticleStyles();
    injectListeners();
    document.getElementById('drop-zone').classList.add('hidden');
    document.getElementById('chat-input-area').classList.remove('disabled');
    document.getElementById('comment-input-area').classList.remove('disabled');
    if (isNew) {
      conversationHistory = [];
      document.getElementById('chat-area').innerHTML = '';
      appendSystem('Ready. Select text then describe an edit, or switch to Comments.');
      pushDocument(html);
    }
    startPolling();
    loadCommentsFromRemote();
    hideLoading();
  };
}

function injectArticleStyles() {
  var old = articleDoc.getElementById('editor-styles');
  if (old) old.remove();
  var s = articleDoc.createElement('style');
  s.id = 'editor-styles';
  s.textContent = [
    '::selection{background:rgba(26,25,23,0.15);}',
    '[contenteditable]:focus{outline:none;}',
    '.claude-highlight{background:rgba(80,180,120,0.3);border-radius:2px;transition:background 1.5s;}',
    '.claude-highlight-fade{background:transparent;}',
    '.comment-mark{background:rgba(255,200,0,0.35);border-bottom:2px solid rgba(200,150,0,0.6);cursor:pointer;border-radius:2px;}'
  ].join('\n');
  articleDoc.head.appendChild(s);
}

function injectListeners() {
  if (!articleDoc) return;
  articleDoc.addEventListener('mouseup', captureSelection);
  articleDoc.addEventListener('keyup', captureSelection);
  // Auto-save on edit (debounced)
  articleDoc.addEventListener('input', debounce(function() {
    var html = '<!DOCTYPE html>\n' + articleDoc.documentElement.outerHTML;
    pushDocument(cleanHTML(html));
  }, 1500));
}

function debounce(fn, ms) {
  var t;
  return function() { clearTimeout(t); t = setTimeout(fn, ms); };
}

function captureSelection() {
  var sel = articleDoc.getSelection();
  if (!sel || sel.isCollapsed || sel.toString().trim().length < 2) return;
  savedRange = sel.getRangeAt(0).cloneRange();
  savedText = sel.toString().trim();
  var frag = savedRange.cloneContents();
  var tmp = articleDoc.createElement('div');
  tmp.appendChild(frag);
  savedHTML = tmp.innerHTML;
  var preview = savedText.length > 70 ? savedText.slice(0,70)+'...' : savedText;
  document.getElementById('selection-text').textContent = '>> ' + preview;
  document.getElementById('selection-text').style.color = '#1a1917';
  document.getElementById('clear-sel').style.display = 'block';
}

function clearSelection() {
  savedRange = null; savedText = ''; savedHTML = '';
  document.getElementById('selection-text').textContent = 'Select text to target edits or comments';
  document.getElementById('selection-text').style.color = '#8a8784';
  document.getElementById('clear-sel').style.display = 'none';
  if (articleDoc) { var s = articleDoc.getSelection(); if(s) s.removeAllRanges(); }
}

// ── Export ────────────────────────────────────────────────────

function cleanHTML(html) {
  var parser = new DOMParser();
  var doc = parser.parseFromString(html, 'text/html');
  var s = doc.getElementById('editor-styles'); if(s) s.remove();
  doc.body && doc.body.removeAttribute('contenteditable');
  doc.body && doc.body.removeAttribute('style');
  var els = doc.querySelectorAll('[contenteditable]');
  for(var i=0;i<els.length;i++) els[i].removeAttribute('contenteditable');
  return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
}

function saveEdits() {
  if (!articleDoc) return;
  var html = cleanHTML('<!DOCTYPE html>\n' + articleDoc.documentElement.outerHTML);
  try {
    var blob = new Blob([html], {type:'text/html'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = (currentFileName||'article') + '_edited.html';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  } catch(e) {
    showCopyOverlay(html);
  }
}

function showCopyOverlay(html) {
  var ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:9999;display:flex;align-items:center;justify-content:center;';
  var box = document.createElement('div');
  box.style.cssText = 'background:#f7f5f0;border-radius:10px;padding:22px;width:580px;max-width:92vw;max-height:80vh;display:flex;flex-direction:column;gap:10px;';
  var ta = document.createElement('textarea');
  ta.value = html;
  ta.style.cssText = 'flex:1;min-height:280px;font-family:\'DM Mono\',monospace;font-size:11px;border:0.5px solid #d8d4cc;border-radius:6px;padding:10px;resize:none;';
  var top = document.createElement('div');
  top.style.cssText = 'display:flex;justify-content:space-between;align-items:center;';
  top.innerHTML = '<span style="font-size:13px;font-weight:500;">Copy HTML — paste into a .html file</span>';
  var close = document.createElement('button');
  close.textContent = '✕'; close.style.cssText = 'background:none;border:none;font-size:16px;cursor:pointer;color:#8a8784;';
  close.onclick = function(){ document.body.removeChild(ov); };
  top.appendChild(close);
  var copyBtn = document.createElement('button');
  copyBtn.textContent = 'Copy all';
  copyBtn.style.cssText = 'background:#1a1917;color:#f7f5f0;border:none;border-radius:6px;padding:9px;font-size:13px;cursor:pointer;';
  copyBtn.onclick = function(){ ta.select(); document.execCommand('copy'); copyBtn.textContent='Copied!'; setTimeout(function(){ copyBtn.textContent='Copy all'; },2000); };
  box.appendChild(top); box.appendChild(ta); box.appendChild(copyBtn);
  ov.appendChild(box); document.body.appendChild(ov);
  setTimeout(function(){ ta.select(); }, 100);
}

// ── Tabs ──────────────────────────────────────────────────────

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-chat').classList.toggle('active', tab==='chat');
  document.getElementById('tab-comments').classList.toggle('active', tab==='comments');
  document.getElementById('panel-chat').style.display = tab==='chat' ? 'flex' : 'none';
  document.getElementById('panel-comments').style.display = tab==='comments' ? 'flex' : 'none';
}

// ── Chat / Claude ─────────────────────────────────────────────

function handleChatKey(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMessage(); } }
function autoResize(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,100)+'px'; }

function appendMsg(role,text){
  var chat=document.getElementById('chat-area');
  var div=document.createElement('div');
  div.className=role==='user'?'msg msg-user':'msg msg-claude';
  div.textContent=text;
  chat.appendChild(div); chat.scrollTop=chat.scrollHeight;
}
function appendAction(text){
  var chat=document.getElementById('chat-area');
  var div=document.createElement('div');
  div.className='msg msg-action'; div.textContent=text;
  chat.appendChild(div); chat.scrollTop=chat.scrollHeight;
}
function appendSystem(text){
  var chat=document.getElementById('chat-area');
  var div=document.createElement('div');
  div.className='msg msg-system'; div.textContent=text;
  chat.appendChild(div); chat.scrollTop=chat.scrollHeight;
}
function appendErr(text){
  var chat=document.getElementById('chat-area');
  var div=document.createElement('div');
  div.className='msg msg-err'; div.textContent=text;
  chat.appendChild(div); chat.scrollTop=chat.scrollHeight;
}
function showThinking(){
  var chat=document.getElementById('chat-area');
  var div=document.createElement('div');
  div.className='thinking'; div.id='thinking';
  div.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  chat.appendChild(div); chat.scrollTop=chat.scrollHeight;
}
function hideThinking(){ var el=document.getElementById('thinking'); if(el) el.remove(); }

function applyInlineEdit(newHTML) {
  if (!articleDoc) return false;
  if (savedRange) {
    try {
      savedRange.deleteContents();
      var frag = savedRange.createContextualFragment(newHTML);
      var wrap = articleDoc.createElement('span');
      wrap.className = 'claude-highlight';
      wrap.appendChild(frag);
      savedRange.insertNode(wrap);
      setTimeout(function(){
        wrap.classList.add('claude-highlight-fade');
        setTimeout(function(){
          var p = wrap.parentNode;
          if(p){ while(wrap.firstChild) p.insertBefore(wrap.firstChild,wrap); p.removeChild(wrap); }
          // Push updated doc
          var html = cleanHTML('<!DOCTYPE html>\n' + articleDoc.documentElement.outerHTML);
          pushDocument(html);
        },1500);
      },2000);
      clearSelection();
      return true;
    } catch(e) { console.warn('Range edit failed:', e); }
  }
  return false;
}

function sendMessage() {
  var input = document.getElementById('user-input');
  var text = input.value.trim();
  if (!text || !articleDoc) return;
  document.getElementById('send-btn').disabled = true;
  input.value = ''; input.style.height = 'auto';
  appendMsg('user', text);

  var hasSelection = !!(savedRange && savedText);
  var bodyCtx = articleDoc.body ? (articleDoc.body.innerText||'').slice(0,3000) : '';

  var sys = 'You are an inline editorial assistant editing an HTML document called "' + (articleTitle||'this document') + '".\n\n'
    + 'DOCUMENT EXCERPT:\n' + bodyCtx + '\n\n'
    + 'RULES:\n'
    + '- If the user requests an EDIT: return ONLY the replacement HTML/text — no explanation, no preamble, no code fences. Just the raw content to splice in.\n'
    + '- If the user asks a QUESTION or makes a non-edit request: reply conversationally in plain text.\n';

  if (hasSelection) {
    sys += '\nSELECTED TEXT: "' + savedText + '"\nSELECTED HTML: ' + savedHTML + '\n\nReplace this selection per the user\'s instruction. Output only the replacement content.';
  } else {
    sys += '\nNo text selected. If an edit is requested, ask the user to highlight the passage first.';
  }

  conversationHistory.push({role:'user', content:text});
  showThinking();

  fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,system:sys,messages:conversationHistory})
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    hideThinking();
    var reply = data.content && data.content.find(function(b){ return b.type==='text'; });
    var replyText = reply ? reply.text : (data.error ? data.error.message : 'No response.');
    conversationHistory.push({role:'assistant',content:replyText});
    if (hasSelection) {
      var ok = applyInlineEdit(replyText.trim());
      appendAction(ok ? 'Edit applied and synced.' : 'Could not apply — try selecting the text again.');
      if (!ok) appendMsg('assistant', replyText);
    } else {
      appendMsg('assistant', replyText);
    }
    document.getElementById('send-btn').disabled = false;
  })
  .catch(function(err){
    hideThinking();
    appendErr('Error: '+err.message);
    document.getElementById('send-btn').disabled = false;
  });
}

// ── Init: try loading from remote on page open ────────────────
window.addEventListener('load', function() {
  showLoading('Checking for saved document...');
  sbFetch("/rest/v1/document_state?id=eq." + DOC_ID + "&select=*")
    .then(function(data) {
      hideLoading();
      if (data && data.length > 0) {
        localVersion = data[0].updated_at;
        loadArticleHTML(data[0].html, false);
        document.getElementById('drop-zone').classList.add('hidden');
        appendSystem('Loaded saved document. Select text to edit or add comments.');
        startPolling();
        loadCommentsFromRemote();
      } else {
        hideLoading();
        // No doc yet — show drop zone
      }
    }).catch(function() { hideLoading(); });
});
